<div class="site-header py-6 px-6">
    {{ partial "menu.html" (dict "menuID" "main" "page" .) }}
    <button class="theme-toggle" type="button" role="switch" aria-checked="true" aria-label="黑夜模式" title="切换到白天模式" hidden>
        <svg class="theme-toggle__sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M9 9h6v6H9zM11 1h2v4h-2zM11 19h2v4h-2zM1 11h4v2H1zM19 11h4v2h-4z" fill="currentColor" stroke="none" />
            <path d="m4 4 3 3m10 10 3 3M4 20l3-3M17 7l3-3" />
        </svg>
        <span class="theme-toggle__track" aria-hidden="true"><span class="theme-toggle__thumb"></span></span>
        <svg class="theme-toggle__moon" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
            <path d="M10 2H6v3H3v4H1v6h2v4h4v3h8v-2h4v-3h3v-5h-4v3h-6v-3H9V6h1z" />
        </svg>
    </button>
</div>
